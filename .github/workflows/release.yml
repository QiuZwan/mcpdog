name: Release

# 只由 tag 触发：npm 的版本发布不可撤回，不该有「点一下就跑」的入口。
# 失败的 run 可在 Actions 页面用 Re-run jobs 重跑，所以不需要 workflow_dispatch。
on:
  push:
    tags: ['v*']

jobs:
  # 桌面壳（Windows 托盘应用）尚未落地 —— 见 docs/superpowers/plans/2026-09-18-mcpdog-windows-shell.md。
  # 用它是否存在来决定要不要跑打包 job：现在就是绿的，等壳的源码进仓库后自动生效，
  # 不需要那时候再来改这份 workflow。
  detect-shell:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          # 两个文件都必须在：tauri.conf.json 声明 bundle.resources，
          # prepare-shell-resources.mjs 产出它所指向的资源目录。
          # 只检查前者会在壳做到一半时激活打包 job 然后失败 —— tauri-build 在
          # bundle.resources 的源路径缺失时是硬失败，不是警告。
          if [ -f src-tauri/tauri.conf.json ] && [ -f scripts/prepare-shell-resources.mjs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "桌面壳尚未完整（需要 src-tauri/tauri.conf.json 与 scripts/prepare-shell-resources.mjs 同时存在），跳过打包。" >> "$GITHUB_STEP_SUMMARY"
          fi

  # 发版包：产出 npm tarball 并创建 GitHub Release。
  # 这一 job 不依赖桌面壳，因此任何 tag 都能得到一个可下载的发版包。
  package:
    name: Build release package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Verify before packaging
        # 发版前必须过闸：产物一旦挂到 Release 上就是对外可见的
        run: |
          npx tsc --noEmit
          npx vitest run
          npx vitest run --config vitest.integration.config.ts

      - name: Build and pack
        # npm pack 不会触发 prepublishOnly，所以先显式构建；
        # package.json 的 files 字段决定 tarball 内含 dist/、web/dist/、README、LICENSE
        run: |
          npm run build
          npm pack
          ls -l *.tgz

      - name: Extract release notes from CHANGELOG
        run: node scripts/extract-release-notes.mjs > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: '*.tgz'
          fail_on_unmatched_files: true

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Detect npm token
        # 未配置 NPM_TOKEN 时跳过而不是让整个 tag 变红 —— 发版包由 package job 负责，
        # npm 发布是可选的一步
        id: token
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "未配置 NPM_TOKEN，跳过 npm 发布（发版包已由 package job 产出）。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish
        if: steps.token.outputs.present == 'true'
        # package.json 的 prepublishOnly 会执行 npm run build（含前端构建）
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  shell-installer:
    name: Build Windows installer
    needs: detect-shell
    if: needs.detect-shell.outputs.present == 'true'
    runs-on: windows-latest
    # 只有这个 job 需要写权限（上传 Release 资产）
    permissions:
      contents: write
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Build app and prepare embedded resources
        # 一次构建两处：npm 包与安装包内嵌的 dist 同源同版本，
        # 否则会出现「壳里是 1.1.0、用户 npx 到的是 1.2.0」的漂移
        run: |
          npm run build
          npm run shell:resources

      - name: Build installer
        run: npx --yes @tauri-apps/cli build
        working-directory: src-tauri
        env:
          # 私钥必须与 src-tauri/tauri.conf.json 的 plugins.updater.pubkey 配对，
          # 否则客户端升级验签失败。密钥由桌面壳的实施阶段生成（见该计划的 Task 6）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate updater manifest
        # `tauri build` 只产出安装包与 .sig，**不产出 latest.json**（官方把该文件归给
        # tauri-action，CLI 里既无此文件名也无清单必需的 pub_date）。缺了它 Release 里就没有
        # latest.json，自更新端点返回 404 且完全无提示。这里用与本地 shell:package 相同的脚本拼装，
        # 保证本地与 CI 产物一致。
        run: node scripts/generate-updater-manifest.mjs

      - name: Upload installer to the same Release
        uses: softprops/action-gh-release@v2
        with:
          # 缺资产必须变红：latest.json 曾经整整缺失而这一步仍是绿的，
          # 于是自更新端点静默 404 却无人发现（兄弟上传步骤已有该标志）
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/latest.json
